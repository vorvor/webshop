w_solo_api.example:
  path: '/w-solo-api/example'
  defaults:
    _title: 'Example'
    _controller: '\Drupal\w_solo_api\Controller\WSoloApiController'
  requirements:
    _permission: 'access content'

w_solo_api.cache:
  path: '/w-solo-api/cache'
  defaults:
    _title: 'Cache'
    _controller: '\Drupal\w_solo_api\Controller\WSoloApiController::readCache'
  requirements:
    _permission: 'access content'

w_solo_api.colors_to_db:
  path: '/w-solo-api/colors-to-db'
  defaults:
    _title: 'Cache'
    _controller: '\Drupal\w_solo_api\Controller\WSoloApiController::colorsToDb'
  requirements:
    _permission: 'access content'

w_solo_api.print_data:
  path: '/w-solo-api/print-data'
  defaults:
    _title: 'Cache'
    _controller: '\Drupal\w_solo_api\Controller\WSoloApiController::printData'
  requirements:
    _permission: 'access content'
